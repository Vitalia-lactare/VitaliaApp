<article class="card campanha-card">
  <div class="card-icon" aria-hidden="true">
    <img src="/static/img/logo.png" alt="">
  </div>
  <h3>{{ c.titulo }}</h3>
  <p>{{ c.resumo }}</p>
  {% if c.data_inicio or c.data_fim %}
    <p class="campanha-datas">
      {% if c.data_inicio %}{{ c.data_inicio }}{% endif %}
      {% if c.data_fim %} – {{ c.data_fim }}{% endif %}
    </p>
  {% endif %}
</article>
